const KEY="jamesDraftV2", HIST="jamesDraftV2History";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||base.map((p,i)=>({...p,id:i,status:"available"}));
let hist=JSON.parse(localStorage.getItem(HIST)||"[]"),filter="ALL",quick=false;
const $=x=>document.getElementById(x), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(HIST,JSON.stringify(hist))}
function change(id,status){let p=state.find(x=>x.id===id);hist.push({id,old:p.status});p.status=status;save();render()}
function undo(){let h=hist.pop();if(!h)return;let p=state.find(x=>x.id===h.id);if(p)p.status=h.old;save();render()}
function clearSearch(){$("search").value="";render();$("search").focus()}
function toggleQuick(){quick=!quick;$("quickBtn").textContent=quick?"⚡ Quick On":"⚡ Quick Off";render()}
function toggleTeam(){$("teamPanel").classList.toggle("show");renderRoster()}
function cls(t){t=String(t).toUpperCase();return ["PRIORITY","TARGET","SMASH"].includes(t)?"good":["FADE","AVOID"].includes(t)?"bad":""}
function available(){return state.filter(p=>p.status==="available").sort((a,b)=>(+a.Rank||9999)-(+b.Rank||9999))}
function renderRoster(){
 let mine=state.filter(p=>p.status==="mine").sort((a,b)=>(+a.Rank||9999)-(+b.Rank||9999));
 let used=new Set(), slots=["QB","RB","RB","WR","WR","TE","FLEX"];
 let rows=slots.map(slot=>{let idx=mine.findIndex((p,i)=>!used.has(i)&&(slot==="FLEX"?["RB","WR","TE"].includes(p.Position):p.Position===slot));if(idx>=0)used.add(idx);let p=idx>=0?mine[idx]:null;return `<div class="slot">${slot}</div><div class="rosterPlayer">${p?`<b>${esc(p.Player)}</b> · ${esc(p.Team)}`:"—"}</div>`}).join("");
 $("roster").innerHTML=`<div class="roster">${rows}</div>`;
 let bench=mine.filter((p,i)=>!used.has(i));$("bench").innerHTML=bench.length?`<h3 style="font-size:13px;margin:12px 0 3px">BENCH</h3>`+bench.map(p=>`<div class="teamplayer"><span>${esc(p.Player)}</span><b>${esc(p.Position)}</b></div>`).join(""):"";
}
function render(){
 let all=available(),q=$("search").value.toLowerCase().trim(),mine=state.filter(p=>p.status==="mine");
 $("status").textContent=`${all.length} available`;
 let top=all[0];$("hero").innerHTML=top?`<div class="heroTitle">BEST AVAILABLE</div><div class="heroName">#${esc(top.Rank)} ${esc(top.Player)} <span style="font-size:13px">${esc(top.Position)}</span></div><div class="heroMeta">${esc(top.Team)} · Tier ${esc(top.Tier)} · ADP ${esc(top["Average (Sleeper, ESPN,NFL,Yahoo) ADP"]||"—")} ${top["Risk Rating"]?`· ${esc(top["Risk Rating"])}`:""}</div>`:`<div class="heroName">Draft complete 🎉</div>`;
 let counts={RB:0,WR:0,QB:0,TE:0};mine.forEach(p=>counts[p.Position]=(counts[p.Position]||0)+1);
 $("summary").innerHTML=["RB","WR","QB","TE"].map(x=>`<div class="pill"><b>${counts[x]||0}</b><span>${x}</span></div>`).join("");
 let arr=all.filter(p=>(filter==="ALL"||p.Position===filter)&&(!q||String(p.Player).toLowerCase().includes(q)||String(p.Team).toLowerCase().includes(q)));
 let out="",last=null;
 arr.forEach(p=>{if(p.Tier!==last){last=p.Tier;out+=`<div class="tier">TIER ${esc(p.Tier)}</div>`}
 let tag=String(p["Risk Rating"]||"").trim(),diff=parseFloat(p["Difference (FSE vs Average)"]);
 out+=`<div class="player" ${quick?`onclick="change(${p.id},'drafted')"`:""}><div class="row"><div class="rank">#${esc(p.Rank)}</div><div class="name">${esc(p.Player)}</div><div class="pos ${esc(p.Position)}">${esc(p.Position)}</div></div>
 <div class="meta">${esc(p.Team)} · ADP ${esc(p["Average (Sleeper, ESPN,NFL,Yahoo) ADP"]||"—")} · Proj ${esc(p["2026 Projection"]||"—")}${Number.isFinite(diff)&&diff>=10?` · <span class="good">+${diff} value</span>`:""}${tag?` · <span class="tag ${cls(tag)}">${esc(tag)}</span>`:""}</div>
 ${quick?"":`<div class="actions"><button class="gone" onclick="change(${p.id},'drafted')">Drafted</button><button class="mine" onclick="change(${p.id},'mine')">+ My Team</button></div>`}</div>`});
 $("board").innerHTML=out||`<div class="empty">No players match.</div>`;renderRoster()
}
const positions=["ALL","RB","WR","QB","TE"];
$("tabs").innerHTML=positions.map(x=>`<button data-p="${x}" class="${x==="ALL"?"active":""}">${x}</button>`).join("");
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{filter=b.dataset.p;document.querySelectorAll("#tabs button").forEach(z=>z.classList.toggle("active",z===b));render()});
$("search").addEventListener("input",render);render();
</script></body></html>
